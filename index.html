<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Periodic Trends</title>
<style>
:root{
  --home-bg:#000000;
  --home-text:#ffffff;
  --nav-bg:#000000;
  --nav-text:#ffffff;
  --nav-dim:#9a9a9a;
  --highlight:#ffd400;
  --play-bg:#c6e2f6;
  --tray-bg:rgba(255,255,255,0.38);
  --tray-stroke:#8fb3cf;
  --panel-bg:#ffffff;
  --panel-stroke:#8a96a1;
  --text:#1b1f23;
  --muted:#5d6670;
  --shell:#6f7d8a;
  --cell:#eef1f4;
  --cell-stroke:#d0d6dc;
  --cell-faint:#b3bac2;
  --link:#1f5fbf;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--home-bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --play-bg:#a9cbe6;
    --tray-bg:rgba(255,255,255,0.28);
    --panel-bg:#f3f6f9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --play-bg:#a9cbe6;
  --tray-bg:rgba(255,255,255,0.28);
  --panel-bg:#f3f6f9;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--home-bg);color:var(--home-text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

.screen{flex:1;min-height:0;display:none;position:relative}
.screen.active{display:flex}

/* Home */
.home{flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,5vh,56px);background:var(--home-bg);padding:16px}
.home-title{margin:0;font-weight:normal;font-size:clamp(30px,5vw,52px);color:var(--home-text);letter-spacing:.01em}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,220px));gap:clamp(14px,2.5vw,32px);width:100%;justify-content:center}
.home-btn{background:none;border:0;color:var(--home-text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px;font:inherit;transition:transform .15s ease}
.home-btn svg{width:100%;height:auto;aspect-ratio:4/3;border-radius:10px;outline:3px solid transparent;outline-offset:3px;transition:outline-color .15s}
.home-btn span{font-size:clamp(15px,1.6vw,19px)}
.home-btn:hover{transform:scale(1.04)}
.home-btn:hover svg,.home-btn:focus-visible svg{outline-color:var(--highlight)}
.home-btn:focus{outline:none}
@media (max-width:820px){.home-grid{grid-template-columns:repeat(2,minmax(0,200px))}}
@media (prefers-reduced-motion:reduce){.home-btn{transition:none}.home-btn:hover{transform:none}}

/* Nav bar */
.navbar{flex:none;height:58px;background:var(--nav-bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-top:1px solid #2b2b2b}
.nav-title{color:var(--nav-text);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-center{display:flex;align-items:center;gap:4px}
.nav-btn{background:none;border:0;border-bottom:3px solid transparent;color:var(--nav-dim);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px 2px;cursor:pointer;font:inherit;opacity:.75}
.nav-btn:hover,.nav-btn:focus-visible{opacity:1;color:var(--nav-text)}
.nav-btn.active{opacity:1;color:var(--nav-text);border-bottom-color:var(--highlight)}
.nav-btn svg.mini{width:42px;height:31px;border-radius:4px}
.nav-btn span{font-size:10px}
.nav-home svg{width:30px;height:30px}
.nav-sep{width:1px;height:32px;background:#333;margin:0 8px}
@media (max-width:680px){.nav-title{display:none}.nav-btn span{display:none}.navbar{grid-template-columns:0 1fr 0;justify-items:center}}

/* Play area */
.play{background:var(--play-bg);align-items:center;justify-content:center}
#enSvg,#ieSvg,#ecSvg,#arSvg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#enSvg text,#ieSvg text,#ecSvg text,#arSvg text{font-family:Arial,Helvetica,sans-serif}
.drop-zone{fill:rgba(255,255,255,.3);stroke:#5d7f9c;stroke-width:2.5;stroke-dasharray:10 7}
.drop-zone.hot{stroke:#e09a00;fill:rgba(255,212,0,.16)}
.zone-text{font-size:20px;fill:var(--muted);text-anchor:middle}
.status-text{font-size:15px;font-weight:bold;fill:var(--text);text-anchor:middle}
.gun-dark{fill:#2f3a46;stroke:#1d252e;stroke-width:2}
.gun-label{font-size:18px;font-weight:bold;fill:#fff;text-anchor:middle}
.gun-meter{fill:#1d252e}
.gun-meter-fill{fill:var(--highlight)}
.nozzle-glow{fill:#8fd0ff}
.field-arc{fill:none;stroke:#1f5fbf;stroke-width:2.6;stroke-linecap:round}
.slider-title{font-size:16px;font-weight:bold;fill:var(--text)}
.slider-track{fill:#fff;stroke:#5b6670;stroke-width:1}
.slider-fill{fill:#4fa3e0}
.slider-tick{stroke:#5b6670;stroke-width:1.2}
.slider-tick-label{font-size:11px;fill:var(--muted);text-anchor:middle}
.slider-thumb{fill:#4fa3e0;stroke:#1f5f99;stroke-width:1.5}
.slider-thumb-line{stroke:#fff;stroke-width:1.5}
.slider-hit{fill:transparent;cursor:pointer}
.arrow-btn{fill:#fff;stroke:#5b6670;stroke-width:1.2;cursor:pointer}
.arrow-btn:hover{fill:#eaf4fc}
.arrow-glyph{fill:#2b3137;pointer-events:none}
.value-box{fill:#fff;stroke:#5b6670;stroke-width:1.2}
.value-text{font-size:16px;font-weight:bold;fill:var(--text);text-anchor:middle}
.e-slot{fill:none;stroke:#1f5fbf;stroke-width:1.5;stroke-dasharray:2.5 2}
.badge-pos .badge-bg{stroke:#c0392b}
.badge-pos .badge-text{fill:#c0392b}
.start-line{stroke:#5d6670;stroke-width:1.5;stroke-dasharray:4 4}
.start-label{font-size:12px;fill:var(--muted);text-anchor:middle}
.pull-arrow{stroke:#d6336c;stroke-width:3;stroke-linecap:round}
.pull-head{fill:#d6336c}
.pair-ring{fill:none;stroke:var(--highlight);stroke-width:2.5}
.delta{font-size:20px;font-weight:bold;text-anchor:middle;paint-order:stroke;stroke:var(--play-bg);stroke-width:4px}
.delta.neg{fill:#1f5fbf}
.delta.pos{fill:#c0392b}
.burst{fill:none;stroke:var(--highlight);stroke-width:3}
.e-dot.added{stroke:#e09a00;stroke-width:1.6}
.ion-btn{cursor:pointer}
.ion-bg{fill:#7048e8;stroke:#4c2fb0;stroke-width:2}
.ion-btn:hover .ion-bg{fill:#7f5af0}
.ion-btn.off{cursor:default}
.ion-btn.off .ion-bg{fill:#c3c8cf;stroke:#9aa3ab}
.ruler-caption{font-size:12px;fill:var(--muted)}
.bulb-glass.dim{fill:#fff3b0;stroke:#d8c27a}
.dt-head{fill:var(--cell)}
.dt-row{fill:#fff;stroke:var(--cell-stroke);stroke-width:1}
.dt-row.alt{fill:#f6f8fa}
.dt-grid{stroke:var(--cell-stroke);stroke-width:1}
.dt-hot{fill:none;stroke:#e09a00;stroke-width:2.5}
.dt-h{font-size:11px;font-weight:bold;fill:var(--text);text-anchor:middle}
.dt-c{font-size:13px;fill:var(--text);text-anchor:middle}
.dt-c.name{text-anchor:start;font-weight:bold}
.tray-label{font-size:14px;font-weight:bold;fill:var(--text)}
.sym-label{font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bond-line{stroke:#2b3137;stroke-width:5;stroke-linecap:round}
.zone-name{font-size:20px;font-weight:bold;fill:var(--text);text-anchor:middle}
.rd-val.big{font-size:44px;font-weight:bold}
.atom-name{display:none}
.ion-text{fill:#fff;font-size:16px;font-weight:bold;text-anchor:middle;pointer-events:none}
.wire{fill:none;stroke:#3a3a3a;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.clamp{fill:#8a8f96;stroke:#4a5056;stroke-width:1.5}
.bulb-glass{fill:#f4f6f8;stroke:#9aa5b1;stroke-width:2}
.bulb-glass.lit{fill:#ffe55c;stroke:#c9a400}
.filament{fill:none;stroke:#7a6a4a;stroke-width:1.6}
.power-btn{cursor:pointer}
.power-bg{fill:#2f9e44;stroke:#1e6b2e;stroke-width:2}
.power-btn.is-on .power-bg{fill:#e8590c;stroke:#a63c06}
.power-text{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;pointer-events:none}
.ctl-label{font-size:15px;font-weight:bold;fill:var(--text);text-anchor:middle}
.sample{cursor:grab}
.sample-label{font-size:14px;font-weight:bold;fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:var(--play-bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.zone-text-sm{font-size:15px;fill:var(--muted);text-anchor:middle}
.ptf-sym{font-size:8.5px;fill:var(--cell-faint);text-anchor:middle}
.ptf-val{font-size:13px;font-weight:bold;fill:#1b1f23;text-anchor:middle}
.ruler{fill:rgba(255,224,102,.88);stroke:#b08900;stroke-width:1.2}
.ruler-tick{stroke:#5c4a00;stroke-width:1}
.ruler-label{font-size:10px;fill:#4a3b00;text-anchor:middle}
.radius-line{stroke:#d6336c;stroke-width:3;stroke-linecap:round}
.radius-line.done{stroke:#2f9e44}
.handle{fill:#e03131;stroke:#fff;stroke-width:2.5}
.handle.done{fill:#2f9e44}
.handle-hit{fill:transparent;cursor:ew-resize}
.shell.hot{stroke:var(--highlight);stroke-width:2.2}
.atom.in-zone .atom-name{display:none}
.rd-name{font-size:24px;font-weight:bold;fill:var(--text);text-anchor:middle}
.rd-val{font-size:32px;fill:var(--text);text-anchor:middle}
.rd-msg{font-size:15px;fill:var(--muted);text-anchor:middle}
.rd-msg.done{fill:#2b8a3e;font-weight:bold}
.tray{fill:var(--tray-bg);stroke:var(--tray-stroke);stroke-width:1.5}
.panel{fill:var(--panel-bg);stroke:var(--panel-stroke);stroke-width:1.2}
.shell{fill:none;stroke:var(--shell);stroke-width:1.3}
.atom{cursor:grab}
.atom:active{cursor:grabbing}
.atom-hit{fill:transparent}
.nucleus{fill:url(#gNuc);stroke:#a8361a;stroke-width:1}
.nuc-label{fill:#fff;font-weight:bold;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e-dot{fill:url(#gEl)}
.e-dot.inner{opacity:.8}
.atom-name{font-size:15px;fill:var(--text);text-anchor:middle;pointer-events:none}
.atom-en{font-size:13px;fill:var(--muted);text-anchor:middle;display:none;pointer-events:none}
#enSvg.show-en .atom-en{display:inline}
.badge-bg{fill:#fff;stroke:#1f5fbf;stroke-width:1.5}
.badge-text{font-size:11px;font-weight:bold;fill:#1f5fbf;text-anchor:middle;dominant-baseline:central}
.e-body{fill:url(#gEl);stroke:#1a4f9e;stroke-width:1.5}
.e-halo{fill:rgba(90,160,255,.22)}
.e-ring{fill:none;stroke:var(--highlight);stroke-width:2.5}
.e-minus{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
.e-label{font-size:15px;fill:var(--text);text-anchor:middle}
.range-circle{fill:rgba(255,212,0,.13);stroke:#c98a00;stroke-width:2;stroke-dasharray:7 5}
.dist-line{stroke:#22282e;stroke-width:1.8;stroke-dasharray:5 4}
.dist-label{font-size:15px;fill:#111;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.hint{transition:none}
.hint-1{font-size:19px;fill:var(--text);text-anchor:middle}
.hint-2{font-size:15px;fill:var(--muted);text-anchor:middle}
.inst-text{font-size:14px;fill:var(--text)}
.inst-num{font-size:14px;font-weight:bold;fill:var(--text)}
.home-sub{margin:-8px 0 0;font-size:clamp(15px,1.8vw,19px);color:#bdbdbd;text-align:center}
.pt-head{cursor:pointer}
.pt-head-bg{fill:transparent}
.pt-title{font-size:15px;font-weight:bold;fill:var(--text)}
.pt-toggle{font-size:15px;fill:var(--text);text-anchor:middle}
.pt-small{font-size:11px;fill:var(--muted)}
.pt-cell{fill:var(--cell);stroke:var(--cell-stroke);stroke-width:1}
.pt-cell.sim{fill:#fff;stroke:#5b6670;stroke-width:1.4}
.pt-sym{font-size:11px;fill:var(--cell-faint);text-anchor:middle}
.pt-sym.sim{font-size:12px;font-weight:bold;fill:#222}
.pt-val{font-size:9.5px;text-anchor:middle;font-weight:bold}
.pt-link{font-size:12px;fill:var(--link);text-anchor:end;cursor:pointer;text-decoration:underline}
.cb{cursor:pointer}
.cb-box{fill:#fff;stroke:#2b3137;stroke-width:1.5}
.cb-mark{fill:none;stroke:#111;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cb-label{font-size:15px;fill:var(--text)}
.cb-hit{fill:transparent}
.reset{cursor:pointer}
.reset-bg{fill:#f2891c;stroke:#b8600a;stroke-width:1.5}
.reset:hover .reset-bg{fill:#ff9f3a}
.reset-arrow{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round}

/* Coming soon */
.soon{flex-direction:column;gap:18px;color:var(--text);text-align:center;padding:20px}
.soon svg{width:min(260px,60vw);height:auto;border-radius:12px}
.soon h2{margin:0;font-weight:normal;font-size:28px}
.soon p{margin:0;color:var(--muted);font-size:16px}
</style>
</head>

<div id="app">
  <!-- Home screen -->
  <section class="screen home active" data-screen="home">
    <h1 class="home-title">Periodic Trends</h1>
    <p class="home-sub">Choose a screen to explore a periodic trend. Use the bar at the bottom to switch screens at any time.</p>
    <div class="home-grid">
      <button class="home-btn" data-go="electronegativity"><svg viewBox="0 0 160 120" aria-hidden="true"><use href="#ic-en"/></svg><span>Electronegativity</span></button>
      <button class="home-btn" data-go="ionization-energy"><svg viewBox="0 0 160 120" aria-hidden="true"><use href="#ic-ie"/></svg><span>Ionization Energy</span></button>
      <button class="home-btn" data-go="conductivity"><svg viewBox="0 0 160 120" aria-hidden="true"><use href="#ic-ec"/></svg><span>Electrical Conductivity</span></button>
      <button class="home-btn" data-go="atomic-radius"><svg viewBox="0 0 160 120" aria-hidden="true"><use href="#ic-ar"/></svg><span>Atomic Radius</span></button>
    </div>
  </section>

  <!-- Electronegativity screen -->
  <section class="screen play" data-screen="electronegativity">
    <svg id="enSvg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="Electronegativity simulation"></svg>
  </section>

  <!-- Placeholder screens -->
  <section class="screen play" data-screen="ionization-energy">
    <svg id="ieSvg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="Ionization energy simulation"></svg>
  </section>
  <section class="screen play" data-screen="conductivity">
    <svg id="ecSvg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="Electrical conductivity simulation"></svg>
  </section>
  <section class="screen play" data-screen="atomic-radius">
    <svg id="arSvg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="Atomic radius simulation"></svg>
  </section>

  <!-- PhET-style navigation bar -->

</div>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent){
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const lerp = (a,b,k) => a + (b - a) * k;
  const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;

  /* ---------- Navigation ---------- */
  const SCREENS = ['home','electronegativity','ionization-energy','conductivity','atomic-radius'];
  let current = 'home';
  function show(id){
    if (!SCREENS.includes(id)) id = 'home';
    current = id;
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.dataset.screen === id));
    document.querySelectorAll('.nav-btn[data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === id));
  }
  function go(id){
    show(id);
    try { const want = id === 'home' ? '' : id; if (location.hash.slice(1) !== want) location.hash = want; } catch(_){}
  }
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-go]');
    if (b) go(b.dataset.go);
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1) || 'home'));

  /* ---------- Shared data ---------- */
  const W = 1200, H = 700;
  // Pauling electronegativity and covalent radius (pm)
  const EL = {
    Li:{name:'Lithium',  en:0.98, rpm:128, shells:[2,1]},
    B: {name:'Boron',    en:2.04, rpm:84,  shells:[2,3]},
    N: {name:'Nitrogen', en:3.04, rpm:71,  shells:[2,5]},
    F: {name:'Fluorine', en:3.98, rpm:57,  shells:[2,7]},
    Na:{name:'Sodium',   en:0.93, rpm:166, shells:[2,8,1]},
    Cl:{name:'Chlorine', en:3.16, rpm:102, shells:[2,8,7]},
    Br:{name:'Bromine',  en:2.96, rpm:120, shells:[2,8,18,7]},
    I: {name:'Iodine',   en:2.66, rpm:139, shells:[2,8,18,18,7]}
  };
  const PT_ROWS = [
    ['H','','','','','','','He'],
    ['Li','Be','B','C','N','O','F','Ne'],
    ['Na','Mg','Al','Si','P','S','Cl','Ar'],
    ['K','Ca','Ga','Ge','As','Se','Br','Kr'],
    ['Rb','Sr','In','Sn','Sb','Te','I','Xe']
  ];
  const GROUPS = ['1','2','13','14','15','16','17','18'];

  /* ---------- Electronegativity screen ---------- */
  (function(){
    const svg = document.getElementById('enSvg');
    const toLocal = svgPointer(svg);
    // Every atom bonds with the same partner, hydrogen (EN 2.20), so the pull reflects the chosen atom alone.
    const H_EN = 2.20;
    const R0 = 26, BS = 1.6;                 // atom circle radius in the tray, and its scale in the bond
    const HR = 22;                           // partner (hydrogen) radius before scaling
    const ZONE = {x:110, y:440, w:820, h:248};
    const XA = {x:230, y:572}, HA = {x:810, y:572};   // atom centers in the bond (bond length is exaggerated)
    const L1 = XA.x + R0 * BS, L2 = HA.x - HR * BS; // ends of the bond line
    const S = {x:(L1 + L2) / 2, y:XA.y};            // starting location of the shared pair
    const VPX = 9;                                   // exaggerated: px the pair moves per displayed unit
    const COLORS = {Li:'#c79bff', Na:'#a98bf0', B:'#ffb38a', N:'#7f9cff', F:'#a6e36b', Cl:'#57d18f', Br:'#c95a55', I:'#9a5fc4'};
    const LIGHT_TEXT = {Br:1, I:1};
    const pullOf = a => Math.round((a.en - H_EN) * 10);
    const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
    const ORDER = ['N','Na','F','Li','Br','B','I','Cl'];
    let recorded = {}, drag = null, bond = null;

    el('rect', {x:0, y:0, width:W, height:H, fill:'transparent'}, svg);
    const gTray = el('g', {}, svg);
    const gZone = el('g', {}, svg);
    const gHint = el('g', {class:'hint'}, svg);
    const gPanel = el('g', {}, svg);
    const gReset = el('g', {}, svg);
    const gBond = el('g', {style:'pointer-events:none'}, svg);
    const gPartner = el('g', {style:'pointer-events:none'}, svg);
    const gAtoms = el('g', {}, svg);
    const gPair = el('g', {style:'pointer-events:none'}, svg);
    const gRead = el('g', {style:'pointer-events:none'}, svg);

    makeTray(gTray, ORDER.map(s => EL[s].name));
    const zoneRect = el('rect', {x:ZONE.x, y:ZONE.y, width:ZONE.w, height:ZONE.h, rx:18, class:'drop-zone'}, gZone);
    const zoneText = el('text', {x:ZONE.x + ZONE.w / 2, y:ZONE.y + ZONE.h / 2 + 7, class:'zone-text'}, gZone);
    zoneText.textContent = 'Drag or tap an atom to form a bond';
    // Double-sided ruler (no units): 0 is where the shared electrons start
    const RU = 20;
    const rul = el('g', {transform:`translate(${S.x},${S.y + 42})`, style:'pointer-events:none'}, gZone);
    el('rect', {x:-RU * VPX - 16, y:0, width:2 * RU * VPX + 32, height:30, rx:3, class:'ruler'}, rul);
    for (let u = -RU; u <= RU; u++){
      const x = -u * VPX, major = u % 5 === 0;
      el('line', {x1:x, y1:0, x2:x, y2:major ? 12 : 6, class:'ruler-tick'}, rul);
      if (major){ const tl = el('text', {x, y:25, class:'ruler-label'}, rul); tl.textContent = u === 0 ? '0' : (u > 0 ? '+' : '−') + Math.abs(u); }
    }
    const rc1 = el('text', {x:-RU * VPX - 16, y:48, class:'ruler-caption', style:'text-anchor:start'}, rul); rc1.textContent = '← toward your atom';
    const rc2 = el('text', {x:RU * VPX + 16, y:48, class:'ruler-caption', style:'text-anchor:end'}, rul); rc2.textContent = 'toward the partner →';
    function inZone(a){ return a.x > ZONE.x && a.x < ZONE.x + ZONE.w && a.y > ZONE.y && a.y < ZONE.y + ZONE.h; }

    makeInstructions(gHint, 482, 14, 448, [
      ['1.','Drag an atom into the bonding box (or tap it).'],
      ['2.','It bonds to a partner atom. Watch the shared electron pair.'],
      ['3.','The pull is recorded: + toward your atom, − away from it.'],
      ['4.','Return the atom to the tray and test the next one.']
    ]);

    const PT = buildMainPT(gPanel, 'translate(18,14) scale(1.5)', 'Pull on shared electrons', 'away (−)', 'toward (+)', -14, 20,
      () => recorded, () => { recorded = {}; PT.update(); }, fmt);

    /* Readout panel */
    el('rect', {x:482, y:146, width:448, height:279, rx:8, class:'panel'}, gPanel);
    const rdEmpty = el('text', {x:706, y:290, class:'rd-msg'}, gPanel); rdEmpty.textContent = 'Pick an atom to see how hard it pulls.';
    const rd1 = el('text', {x:706, y:196, class:'rd-msg'}, gRead); rd1.textContent = 'Your atom';
    const rd2 = el('text', {x:706, y:232, class:'rd-name'}, gRead);
    const rd3 = el('text', {x:706, y:290, class:'rd-msg'}, gRead); rd3.textContent = 'Pull on shared electrons';
    const rd4 = el('text', {x:706, y:346, class:'rd-val big'}, gRead);
    const rd5 = el('text', {x:706, y:384, class:'rd-msg'}, gRead);

    /* Atoms: plain circles with the element symbol */
    const atoms = [];
    function buildAtom(sym, i){
      const d = EL[sym], p = traySlot(i);
      const a = Object.assign({sym, x:p.x, y:p.y, hx:p.x, hy:p.y, anim:null, s:1, ts:1}, d);
      a.g = el('g', {class:'atom'}, gAtoms);
      el('circle', {r:R0 + 6, class:'atom-hit'}, a.g);
      el('circle', {r:R0, fill:COLORS[sym], stroke:'#3b4756', 'stroke-width':1.5}, a.g);
      el('ellipse', {cx:-8, cy:-10, rx:8, ry:5, fill:'#fff', opacity:.4}, a.g);
      const t = el('text', {class:'sym-label', fill:LIGHT_TEXT[sym] ? '#fff' : '#1b1f23'}, a.g); t.textContent = sym;
      a.g.addEventListener('pointerdown', ev => startDrag(ev, a));
      return a;
    }
    ORDER.forEach((s, i) => atoms.push(buildAtom(s, i)));

    /* Partner atom (hydrogen) and the bond line */
    const partner = {x:HA.x + 120, op:0, anim:null};
    partner.g = el('g', {style:'opacity:0'}, gPartner);
    el('circle', {r:HR, fill:'#f4f6f8', stroke:'#3b4756', 'stroke-width':1.5}, partner.g);
    const pl = el('text', {class:'sym-label', fill:'#1b1f23'}, partner.g); pl.textContent = 'H';
    const bondLine = el('line', {x1:L1, y1:S.y, x2:L2, y2:S.y, class:'bond-line', style:'opacity:0'}, gBond);
    const startLine = el('line', {x1:S.x, y1:S.y - 34, x2:S.x, y2:S.y + 42, class:'start-line'}, gBond);
    const startLbl = el('text', {x:S.x, y:S.y - 40, class:'start-label'}, gBond); startLbl.textContent = 'start';

    /* Shared electron pair, pull arrow, partial charges */
    const arrowLine = el('line', {class:'pull-arrow'}, gPair);
    const arrowHead = el('polygon', {points:'0,0 -10,-7 -10,7', class:'pull-head'}, gPair);
    const pairG = el('g', {}, gPair);
    el('circle', {cx:-7, cy:0, r:9, class:'pair-ring'}, pairG);
    el('circle', {cx:7, cy:0, r:9, class:'pair-ring'}, pairG);
    el('circle', {cx:-7, cy:0, r:5.5, class:'e-dot'}, pairG);
    el('circle', {cx:7, cy:0, r:5.5, class:'e-dot'}, pairG);
    const dX = el('text', {class:'delta'}, gPair);
    const dH = el('text', {class:'delta'}, gPair);

    function placeInBond(a, t){
      if (bond && bond.a !== a) release(bond.a, t, true);
      bond = {a, t0:t, done:false};
      a.ts = BS;
      a.anim = {fx:a.x, fy:a.y, tx:XA.x, ty:XA.y, start:t, dur:350};
      partner.anim = {fx:HA.x + 120, tx:HA.x, start:t + 250, dur:450};
      partner.x = HA.x + 120;
    }
    function release(a, t, goHome){
      if (bond && bond.a === a) bond = null;
      a.ts = 1;
      if (goHome) a.anim = {fx:a.x, fy:a.y, tx:a.hx, ty:a.hy, start:t, dur:450};
    }
    function startDrag(ev, a){
      ev.preventDefault();
      a.anim = null;
      const wasBonded = !!(bond && bond.a === a);
      if (wasBonded) release(a, performance.now(), false);
      const p = toLocal(ev);
      drag = {a, id:ev.pointerId, dx:a.x - p.x, dy:a.y - p.y, px:p.x, py:p.y, wasBonded};
      gAtoms.appendChild(a.g);
      try { svg.setPointerCapture(ev.pointerId); } catch(_){}
    }
    svg.addEventListener('pointermove', ev => {
      if (!drag || ev.pointerId !== drag.id) return;
      const p = toLocal(ev), a = drag.a, r = R0 * a.s;
      a.x = clamp(p.x + drag.dx, r + 4, W - r - 4);
      a.y = clamp(p.y + drag.dy, r + 4, H - r - 4);
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(n => svg.addEventListener(n, ev => {
      if (!drag || ev.pointerId !== drag.id) return;
      const d = drag, a = d.a, t = performance.now();
      drag = null;
      let tapped = false;
      if (n === 'pointerup'){ const p = toLocal(ev); tapped = Math.hypot(p.x - d.px, p.y - d.py) < 6; }
      if ((tapped && !d.wasBonded) || inZone(a)) placeInBond(a, t);
      else release(a, t, true);
    }));

    makeReset(gReset, () => {
      const t = performance.now();
      drag = null;
      if (bond) release(bond.a, t, false);
      bond = null;
      atoms.forEach(a => { a.ts = 1; a.anim = {fx:a.x, fy:a.y, tx:a.hx, ty:a.hy, start:t, dur:450}; });
    });

    function frame(t){
      if (current === 'electronegativity'){
        atoms.forEach(a => {
          if (a.anim){
            const p = clamp((t - a.anim.start) / a.anim.dur, 0, 1), k = ease(p);
            a.x = lerp(a.anim.fx, a.anim.tx, k); a.y = lerp(a.anim.fy, a.anim.ty, k);
            if (p >= 1) a.anim = null;
          }
          a.s += (a.ts - a.s) * 0.2;
          if (Math.abs(a.ts - a.s) < 0.002) a.s = a.ts;
          a.g.setAttribute('transform', `translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${a.s.toFixed(3)})`);
        });

        // Partner slides in while bonded and fades away otherwise
        let targetOp = 0;
        if (bond && partner.anim){
          const pa = partner.anim, p = clamp((t - pa.start) / pa.dur, 0, 1), k = ease(p);
          partner.x = lerp(pa.fx, pa.tx, k);
          targetOp = k;
        }
        partner.op += (targetOp - partner.op) * 0.25;
        partner.g.style.opacity = partner.op.toFixed(3);
        partner.g.setAttribute('transform', `translate(${partner.x.toFixed(1)},${HA.y}) scale(${BS})`);
        const lineOp = bond ? clamp((t - bond.t0 - 600) / 300, 0, 1) : 0;
        bondLine.style.opacity = lineOp.toFixed(2);
        startLine.style.display = startLbl.style.display = lineOp > 0 ? '' : 'none';

        const showPair = bond && t > bond.t0 + 800;
        gPair.style.display = showPair ? '' : 'none';
        gRead.style.display = bond ? '' : 'none';
        rdEmpty.style.display = bond ? 'none' : '';
        if (bond){
          const a = bond.a;
          const k = ease(clamp((t - bond.t0 - 1000) / 1500, 0, 1));
          const units = (a.en - H_EN) * 10 * k;     // + toward the chosen atom (left)
          const shift = units * VPX;
          const px = S.x - shift;
          pairG.setAttribute('transform', `translate(${px.toFixed(1)},${S.y})`);
          const big = Math.abs(shift) >= 12;
          arrowLine.style.display = arrowHead.style.display = big ? '' : 'none';
          if (big){
            const ay = S.y + 30, dir = shift > 0 ? -1 : 1;
            arrowLine.setAttribute('x1', S.x); arrowLine.setAttribute('y1', ay);
            arrowLine.setAttribute('x2', (px - dir * 6).toFixed(1)); arrowLine.setAttribute('y2', ay);
            arrowHead.setAttribute('transform', `translate(${px.toFixed(1)},${ay}) scale(${dir},1)`);
          }
          rd2.textContent = a.name;
          rd4.textContent = fmt(Math.round(units));
          if (k >= 1 && !bond.done){
            bond.done = true;
            recorded[a.sym] = pullOf(a);
            PT.update();
          }
          const v = pullOf(a);
          rd5.textContent = !bond.done ? '' : v > 0 ? 'toward your atom' : v < 0 ? 'away from your atom' : 'shared evenly';
          const showD = bond.done && v !== 0;
          dX.style.display = dH.style.display = showD ? '' : 'none';
          if (showD){
            dX.setAttribute('x', XA.x); dX.setAttribute('y', (XA.y - R0 * BS - 14).toFixed(1));
            dH.setAttribute('x', HA.x); dH.setAttribute('y', (HA.y - HR * BS - 14).toFixed(1));
            dX.textContent = v > 0 ? 'δ−' : 'δ+';
            dH.textContent = v > 0 ? 'δ+' : 'δ−';
            dX.setAttribute('class', 'delta ' + (v > 0 ? 'neg' : 'pos'));
            dH.setAttribute('class', 'delta ' + (v > 0 ? 'pos' : 'neg'));
          }
        }

        const over = drag && inZone(drag.a);
        zoneRect.classList.toggle('hot', !!over);
        zoneText.style.display = (bond || over) ? 'none' : '';
        PT.highlight(drag ? drag.a.sym : (bond ? bond.a.sym : null));
      }
      requestAnimationFrame(frame);
    }
    PT.update();
    requestAnimationFrame(frame);
  })();

  /* ---------- Ionization energy screen ---------- */
  (function(){
    const svg = document.getElementById('ieSvg');
    // First ionization energies (kJ/mol); strength needed = IE / 20, rounded
    const IE_KJ = {Li:520, B:801, N:1402, F:1681, Na:496, Cl:1251, Br:1140, I:1008};
    const ZONE = {x:430, y:20, w:490, h:310, cx:620, cy:185};
    const TS = 0.55, ZS = 1.6;   // atom scale in the tray and in the box
    const TIP = {x:362, y:185};
    const TX0 = 58, TX1 = 342, TY = 396;
    const EJ = -Math.PI / 4;   // direction the ejected electron flies: away from the ejector and the atom
    let strength = 0, recorded = {}, drag = null, sliderDrag = null, zoneAtom = null, fly = null, flashT = -1e9, hintHidden = false, burst = null;

    function toLocal(ev){
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    const defs = el('defs', {}, svg);
    const lg = el('linearGradient', {id:'gGun', x1:0, y1:0, x2:0, y2:1}, defs);
    el('stop', {offset:0, 'stop-color':'#8496aa'}, lg);
    el('stop', {offset:1, 'stop-color':'#3b4756'}, lg);

    el('rect', {x:0, y:0, width:W, height:H, fill:'transparent'}, svg);
    const gTray = el('g', {}, svg);
    const gZone = el('g', {}, svg);
    const gHint = el('g', {class:'hint'}, svg);
    const gPanel = el('g', {}, svg);
    const gField = el('g', {style:'pointer-events:none'}, svg);
    const gGun = el('g', {}, svg);
    const gSlider = el('g', {}, svg);
    const gReset = el('g', {}, svg);
    const gAtoms = el('g', {}, svg);
    const gFly = el('g', {style:'pointer-events:none'}, svg);

    makeTray(gTray, ['Nitrogen','Sodium','Fluorine','Lithium','Bromine','Boron','Iodine','Chlorine']);

    /* Drop zone */
    const zoneRect = el('rect', {x:ZONE.x, y:ZONE.y, width:ZONE.w, height:ZONE.h, rx:18, class:'drop-zone'}, gZone);
    const zoneText = el('text', {x:ZONE.cx, y:ZONE.cy + 7, class:'zone-text'}, gZone);
    zoneText.textContent = 'Drag an atom here';
    const status = el('text', {x:ZONE.cx, y:ZONE.y + ZONE.h - 14, class:'status-text'}, gZone);
    const zoneName = el('text', {x:ZONE.cx, y:ZONE.y + 32, class:'zone-name'}, gZone);
    function inZone(a){ return a.x > ZONE.x && a.x < ZONE.x + ZONE.w && a.y > ZONE.y && a.y < ZONE.y + ZONE.h; }

    /* Hint */
    makeInstructions(gHint, 30, 440, 340, [
      ['1.','Drag an atom into the box.'],
      ['2.','Slowly raise the energy until the'],
      ['','ejector knocks an electron off.'],
      ['3.','The energy needed is recorded.'],
      ['4.','Return the atom to the tray and'],
      ['','test the next one.']
    ]);

    /* Electron stealer */
    el('path', {d:'M112 222 L168 222 L150 298 Q148 304 142 304 L104 304 Q97 304 98 297 Z', class:'gun-dark'}, gGun);
    el('rect', {x:48, y:160, width:24, height:50, rx:6, class:'gun-dark'}, gGun);
    el('rect', {x:62, y:142, width:240, height:86, rx:18, fill:'url(#gGun)', stroke:'#1d252e', 'stroke-width':2}, gGun);
    el('rect', {x:296, y:166, width:38, height:38, rx:4, fill:'#6f7f90', stroke:'#1d252e', 'stroke-width':2}, gGun);
    el('path', {d:'M332 160 L362 146 L362 224 L332 210 Z', fill:'#9aa9b8', stroke:'#1d252e', 'stroke-width':2, 'stroke-linejoin':'round'}, gGun);
    const gl = el('text', {x:182, y:182, class:'gun-label'}, gGun); gl.textContent = 'Electron Ejector';
    el('rect', {x:92, y:198, width:180, height:10, rx:5, class:'gun-meter'}, gGun);
    const meterFill = el('rect', {x:92, y:198, width:0, height:10, rx:5, class:'gun-meter-fill'}, gGun);
    const glow = el('circle', {cx:TIP.x, cy:TIP.y, r:8, class:'nozzle-glow'}, gGun);
    const arcs = [0,1,2,3].map(() => el('path', {d:'M0 -20 Q12 0 0 20', class:'field-arc'}, gField));

    /* Strength slider */
    el('rect', {x:30, y:322, width:340, height:112, rx:8, class:'panel'}, gSlider);
    const stt = el('text', {x:46, y:351, class:'slider-title'}, gSlider); stt.textContent = 'Energy';
    function arrowBtn(x, dir){
      const g = el('g', {}, gSlider);
      el('rect', {x, y:332, width:24, height:26, rx:4, class:'arrow-btn'}, g);
      const c = x + 12;
      const pts = dir < 0 ? [[c+4,338],[c-5,345],[c+4,352]] : [[c-4,338],[c+5,345],[c-4,352]];
      el('polygon', {points: pts.map(p => p.join(',')).join(' '), class:'arrow-glyph'}, g);
      g.addEventListener('click', () => setStrength(strength + dir));
    }
    arrowBtn(248, -1);
    el('rect', {x:276, y:332, width:50, height:26, rx:4, class:'value-box'}, gSlider);
    const valText = el('text', {x:301, y:351, class:'value-text'}, gSlider);
    arrowBtn(330, 1);
    const sl = el('g', {}, gSlider);
    el('rect', {x:TX0, y:TY - 3, width:TX1 - TX0, height:6, rx:3, class:'slider-track'}, sl);
    const slFill = el('rect', {x:TX0, y:TY - 3, width:0, height:6, rx:3, class:'slider-fill'}, sl);
    [0,25,50,75,100].forEach(v => {
      const x = TX0 + v / 100 * (TX1 - TX0);
      el('line', {x1:x, y1:TY + 9, x2:x, y2:TY + 17, class:'slider-tick'}, sl);
      const tl = el('text', {x, y:TY + 31, class:'slider-tick-label'}, sl); tl.textContent = v;
    });
    const thumb = el('g', {}, sl);
    el('rect', {x:-8, y:-14, width:16, height:28, rx:3, class:'slider-thumb'}, thumb);
    el('line', {x1:0, y1:-8, x2:0, y2:8, class:'slider-thumb-line'}, thumb);
    el('rect', {x:TX0 - 12, y:TY - 20, width:TX1 - TX0 + 24, height:40, class:'slider-hit'}, sl);

    function setStrength(v){
      strength = clamp(Math.round(v), 0, 100);
      const x = TX0 + strength / 100 * (TX1 - TX0);
      thumb.setAttribute('transform', `translate(${x.toFixed(1)},${TY})`);
      slFill.setAttribute('width', (x - TX0).toFixed(1));
      valText.textContent = strength;

    }
    sl.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      sliderDrag = ev.pointerId;
      try { svg.setPointerCapture(ev.pointerId); } catch(_){}
      setStrength((toLocal(ev).x - TX0) / (TX1 - TX0) * 100);
    });

    /* Periodic table panel */
    const PT = (function(){
      const P = el('g', {transform:'translate(392,336) scale(1.3)'}, gPanel);
      const pBg = el('rect', {x:0, y:0, width:300, height:274, rx:8, class:'panel'}, P);
      const head = el('g', {class:'pt-head'}, P);
      el('rect', {x:0, y:0, width:300, height:32, class:'pt-head-bg'}, head);
      const ttl = el('text', {x:12, y:22, class:'pt-title'}, head); ttl.textContent = 'Periodic Table';
      const arrow = el('text', {x:284, y:22, class:'pt-toggle'}, head); arrow.textContent = '▾';
      const body = el('g', {}, P);
      const gc = el('text', {x:168, y:46, class:'pt-small', 'text-anchor':'middle'}, body); gc.textContent = 'Group';
      GROUPS.forEach((g, c) => { const t = el('text', {x:40 + c*32 + 15, y:60, class:'pt-small', 'text-anchor':'middle'}, body); t.textContent = g; });
      const pc = el('text', {x:14, y:141, class:'pt-small', 'text-anchor':'middle', transform:'rotate(-90 14 141)'}, body); pc.textContent = 'Period';
      const cellsIE = {};
      PT_ROWS.forEach((row, r) => {
        const rl = el('text', {x:30, y:66 + r*30 + 18, class:'pt-small', 'text-anchor':'middle'}, body); rl.textContent = r + 1;
        row.forEach((sym, c) => {
          if (!sym) return;
          const x = 40 + c*32, y = 66 + r*30, sim = !!EL[sym];
          const rect = el('rect', {x, y, width:30, height:28, rx:3, class:'pt-cell' + (sim ? ' sim' : '')}, body);
          const st = el('text', {x:x + 15, y: sim ? y + 13 : y + 18, class:'pt-sym' + (sim ? ' sim' : '')}, body);
          st.textContent = sym;
          if (sim){ const vt = el('text', {x:x + 15, y:y + 24.5, class:'pt-val'}, body); cellsIE[sym] = {rect, sym:st, val:vt}; }
        });
      });
      const lc = el('text', {x:40, y:236, class:'pt-small'}, body); lc.textContent = 'Energy needed';
      el('rect', {x:40, y:242, width:150, height:9, rx:2, fill:'url(#gScale)', stroke:'#9aa3ab', 'stroke-width':.8}, body);
      const lo = el('text', {x:40, y:264, class:'pt-small'}, body); lo.textContent = 'low';
      const hi = el('text', {x:190, y:264, class:'pt-small', 'text-anchor':'end'}, body); hi.textContent = 'high';
      const clr = el('text', {x:288, y:264, class:'pt-link'}, body); clr.textContent = 'Clear data';
      clr.addEventListener('click', () => { recorded = {}; update(); });
      let open = true;
      head.addEventListener('click', () => {
        open = !open;
        body.style.display = open ? '' : 'none';
        pBg.setAttribute('height', open ? 274 : 32);
        arrow.textContent = open ? '▾' : '▸';
      });
      function update(){
        for (const sym in cellsIE){
          const c = cellsIE[sym], v = recorded[sym];
          if (v != null){
            const t = clamp((v - 20) / 70, 0, 1), dark = t > 0.55;
            c.rect.style.fill = `rgb(${Math.round(lerp(255,196,t))},${Math.round(lerp(240,56,t))},${Math.round(lerp(176,18,t))})`;
            c.sym.style.fill = dark ? '#fff' : '#222';
            c.val.style.fill = dark ? '#fff' : '#333';
            c.val.textContent = v;
          } else { c.rect.style.fill = ''; c.sym.style.fill = ''; c.val.textContent = ''; }
        }
      }
      let last = null;
      function highlight(sym){
        if (sym === last) return;
        if (last && cellsIE[last]){ cellsIE[last].rect.style.stroke = ''; cellsIE[last].rect.style.strokeWidth = ''; }
        if (sym && cellsIE[sym]){ cellsIE[sym].rect.style.stroke = '#e09a00'; cellsIE[sym].rect.style.strokeWidth = '3'; }
        last = sym;
      }
      return {update, highlight};
    })();

    /* Atoms */
    const atoms = [];
    function makeAtom(sym, hx, hy){
      const d = EL[sym];
      const a = Object.assign({sym, x:hx, y:hy, hx, hy, anim:null, removed:false, s:TS, ts:TS}, d);
      a.R = 18 + d.rpm * 0.3; a.nucR = 13; a.need = Math.round(IE_KJ[sym] / 20);
      a.g = el('g', {class:'atom'}, gAtoms);
      el('circle', {r:a.R + 8, class:'atom-hit'}, a.g);
      const n = d.shells.length, shellR = [];
      for (let k = 1; k <= n; k++){
        const r = a.nucR + 4 + (a.R - a.nucR - 4) * k / n;
        shellR.push(r);
        el('circle', {r:r.toFixed(2), class:'shell'}, a.g);
      }
      for (let k = 0; k < n - 1; k++){
        const c = d.shells[k], r = shellR[k];
        for (let i = 0; i < c; i++){
          const ang = -Math.PI/2 + i * 2 * Math.PI / c + k * 0.4;
          el('circle', {cx:(r*Math.cos(ang)).toFixed(2), cy:(r*Math.sin(ang)).toFixed(2), r:3.3, class:'e-dot inner'}, a.g);
        }
      }
      // Valence electrons; the one at the upper right is the one that gets ejected
      const v = d.shells[n - 1];
      for (let i = 1; i < v; i++){
        const ang = EJ + i * 2 * Math.PI / v;
        el('circle', {cx:(a.R*Math.cos(ang)).toFixed(2), cy:(a.R*Math.sin(ang)).toFixed(2), r:4, class:'e-dot'}, a.g);
      }
      a.slot = el('circle', {cx:(a.R*Math.cos(EJ)).toFixed(2), cy:(a.R*Math.sin(EJ)).toFixed(2), r:4.5, class:'e-slot', style:'display:none'}, a.g);
      a.target = el('circle', {cx:(a.R*Math.cos(EJ)).toFixed(2), cy:(a.R*Math.sin(EJ)).toFixed(2), r:4, class:'e-dot'}, a.g);
      el('circle', {r:a.nucR, class:'nucleus'}, a.g);
      const t = el('text', {class:'nuc-label', 'font-size': sym.length > 1 ? 11 : 13}, a.g); t.textContent = sym;
      const nm = el('text', {y:(a.R + 19).toFixed(1), class:'atom-name'}, a.g); nm.textContent = d.name;
      a.badge = el('g', {transform:`translate(${(-a.R*0.72-9).toFixed(1)},${(-a.R*0.72-9).toFixed(1)})`, class:'badge-pos', style:'display:none'}, a.g);
      el('circle', {r:11, class:'badge-bg'}, a.badge);
      const bt = el('text', {class:'badge-text'}, a.badge); bt.textContent = '1+';
      a.g.addEventListener('pointerdown', ev => startDrag(ev, a));
      return a;
    }
    ['N','Na','F','Li','Br','B','I','Cl'].forEach((s, i) => { const p = traySlot(i); atoms.push(makeAtom(s, p.x, p.y)); });

    const flyC = el('circle', {r:5, class:'e-body', style:'display:none'}, gFly);
    const burstC = el('circle', {r:6, class:'burst', style:'display:none'}, gFly);

    function restore(a){
      a.removed = false;
      a.target.style.display = '';
      a.slot.style.display = 'none';
      a.badge.style.display = 'none';
    }
    function sendHome(a, t){
      restore(a);
      a.ts = TS;
      a.anim = {fx:a.x, fy:a.y, tx:a.hx, ty:a.hy, start:t, dur:450};
    }
    function removeElectron(a, t){
      const x0 = a.x + parseFloat(a.target.getAttribute('cx')) * a.s, y0 = a.y + parseFloat(a.target.getAttribute('cy')) * a.s;
      a.removed = true;
      a.target.style.display = 'none';
      a.slot.style.display = '';
      a.badge.style.display = '';
      fly = {x0, y0, start:t, dur:850};
      burst = {x:x0, y:y0, start:t};
      flashT = t;
      recorded[a.sym] = a.need;
      PT.update();
      status.textContent = 'Electron ejected! Energy: ' + a.need;
      if (!hintHidden){ hintHidden = true; gHint.classList.add('gone'); }
    }

    function startDrag(ev, a){
      ev.preventDefault();
      a.anim = null;
      if (zoneAtom === a){ zoneAtom = null; status.textContent = ''; }
      a.ts = TS;
      const p = toLocal(ev);
      drag = {a, id:ev.pointerId, dx:a.x - p.x, dy:a.y - p.y};
      gAtoms.appendChild(a.g);
      try { svg.setPointerCapture(ev.pointerId); } catch(_){}
    }
    svg.addEventListener('pointermove', ev => {
      if (sliderDrag === ev.pointerId){ setStrength((toLocal(ev).x - TX0) / (TX1 - TX0) * 100); return; }
      if (!drag || ev.pointerId !== drag.id) return;
      const p = toLocal(ev), a = drag.a;
      const r = a.R * a.s;
      a.x = clamp(p.x + drag.dx, r + 4, W - r - 4);
      a.y = clamp(p.y + drag.dy, r + 4, H - r - 4);
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(n => svg.addEventListener(n, ev => {
      if (sliderDrag === ev.pointerId) sliderDrag = null;
      if (!drag || ev.pointerId !== drag.id) return;
      const a = drag.a, t = performance.now();
      drag = null;
      if (inZone(a)){
        if (zoneAtom && zoneAtom !== a) sendHome(zoneAtom, t);
        restore(a);
        zoneAtom = a;
        status.textContent = '';
        a.ts = ZS;
        a.anim = {fx:a.x, fy:a.y, tx:ZONE.cx, ty:ZONE.cy, start:t, dur:300};
        setStrength(0); // each new trial starts from zero
      } else {
        sendHome(a, t);
      }
    }));

    /* Reset (bottom left) */
    const rg = el('g', {class:'reset', transform:'translate(56,636)'}, gReset);
    const rtl = el('title', {}, rg); rtl.textContent = 'Reset';
    el('circle', {r:30, class:'reset-bg'}, rg);
    const ra = el('g', {transform:'scale(1.35)'}, rg);
    el('path', {d:'M11.8 2.1 A12 12 0 1 1 6 -10.4', class:'reset-arrow'}, ra);
    el('polygon', {points:'12.4,-6.6 3.2,-6 8.8,-15', fill:'#fff'}, ra);
    rg.addEventListener('click', () => {
      const t = performance.now();
      drag = null; sliderDrag = null; zoneAtom = null; fly = null; burst = null;
      burstC.style.display = 'none';
      flyC.style.display = 'none';
      status.textContent = '';
      atoms.forEach(a => sendHome(a, t));
      setStrength(0);
    });

    function render(t){
      atoms.forEach(a => {
        a.s += (a.ts - a.s) * 0.2;
        if (Math.abs(a.ts - a.s) < 0.002) a.s = a.ts;
        a.g.setAttribute('transform', `translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${a.s.toFixed(3)})`);
        if (a.removed) return;
        // The targeted electron gains energy: it bounces farther out and shakes harder as energy rises
        let rr = a.R, jx = 0, jy = 0;
        if (a === zoneAtom && !a.anim){
          const r = clamp(strength / a.need, 0, 1);
          rr += 7 * r * r;
          const amp = 2.8 * r * r;
          jx = Math.sin(t / 21) * amp; jy = Math.cos(t / 27) * amp;
        }
        a.target.setAttribute('cx', (rr * Math.cos(EJ) + jx).toFixed(2));
        a.target.setAttribute('cy', (rr * Math.sin(EJ) + jy).toFixed(2));
      });

      if (fly){
        // Ejected electron shoots away from both the ejector and the atom, then fades
        const p = clamp((t - fly.start) / fly.dur, 0, 1), k = 1 - Math.pow(1 - p, 2);
        flyC.style.display = '';
        flyC.setAttribute('cx', (fly.x0 + Math.cos(EJ) * 300 * k).toFixed(1));
        flyC.setAttribute('cy', (fly.y0 + Math.sin(EJ) * 300 * k).toFixed(1));
        flyC.style.opacity = (1 - p * p).toFixed(2);
        if (p >= 1){ fly = null; flyC.style.display = 'none'; }
      }
      if (burst){
        const p = clamp((t - burst.start) / 450, 0, 1);
        burstC.style.display = '';
        burstC.setAttribute('cx', burst.x.toFixed(1)); burstC.setAttribute('cy', burst.y.toFixed(1));
        burstC.setAttribute('r', (6 + 26 * p).toFixed(1));
        burstC.style.opacity = (1 - p).toFixed(2);
        if (p >= 1){ burst = null; burstC.style.display = 'none'; }
      }

      const fl = clamp(1 - (t - flashT) / 400, 0, 1);
      glow.setAttribute('r', (6 + strength * 0.1 + fl * 10).toFixed(1));
      glow.style.opacity = Math.min(1, 0.25 + strength / 100 * 0.6 + fl * 0.4).toFixed(2);

      const start = TIP.x + 10;
      const end = zoneAtom ? Math.max(start + 60, zoneAtom.x - zoneAtom.R * zoneAtom.s - 12) : ZONE.x + 50;
      const span = end - start;
      arcs.forEach((p, i) => {
        const x = start + ((t * 0.09 + i * span / 4) % span);   // energy waves travel from the ejector to the atom
        const edge = Math.max(0, Math.min(1, (x - start) / 25, (end - x) / 25));
        p.setAttribute('transform', `translate(${x.toFixed(1)},${TIP.y})`);
        p.style.opacity = (strength / 100 * 0.9 * edge).toFixed(2);
      });

      const over = drag && inZone(drag.a);
      zoneRect.classList.toggle('hot', !!over);
      zoneText.style.display = (zoneAtom || over) ? 'none' : '';
      zoneName.textContent = zoneAtom ? zoneAtom.name : '';
      PT.highlight(drag ? drag.a.sym : (zoneAtom ? zoneAtom.sym : null));
    }

    function frame(t){
      if (current === 'ionization-energy'){
        atoms.forEach(a => {
          if (!a.anim) return;
          const p = clamp((t - a.anim.start) / a.anim.dur, 0, 1), k = ease(p);
          a.x = lerp(a.anim.fx, a.anim.tx, k); a.y = lerp(a.anim.fy, a.anim.ty, k);
          if (p >= 1) a.anim = null;
        });
        const za = zoneAtom;
        if (za && !za.anim && !za.removed && strength >= za.need) removeElectron(za, t);
        render(t);
      }
      requestAnimationFrame(frame);
    }

    setStrength(0);
    PT.update();
    requestAnimationFrame(frame);
  })();

      [86, 166, 222].forEach(x => el('line', {x1:x, y1:32, x2:x, y2:258, class:'dt-grid'}, P));
      const hl = el('rect', {x:10, y:66, width:290, height:24, class:'dt-hot', style:'display:none'}, P);
      const clr = el('text', {x:298, y:276, class:'pt-link'}, P); clr.textContent = 'Clear data';
      clr.addEventListener('click', () => { recorded = {}; update(); });
      function update(){
        for (const sym in cells){
          const r = recorded[sym] || {}, c = cells[sym];
          c.ca.textContent = r.atom != null ? r.atom : '';
          c.cc.textContent = r.charge || '';
          c.ci.textContent = r.ion != null ? r.ion : '';
        }
      }
      function highlight(sym){
        if (sym && cells[sym]){ hl.style.display = ''; hl.setAttribute('y', cells[sym].y); }
        else hl.style.display = 'none';
      }
      return {update, highlight};
    })();
    const chargeLabel = c => c === '+' ? '1+' : c === '−' ? '1−' : c;

    function leaveZone(a){
      a.ts = TS;
      a.g.classList.remove('in-zone');
      a.outer.classList.remove('hot');
      if (a.ionG){ a.isIon = false; a.morph = null; a.ionOuter.classList.remove('hot'); applyMorph(a, 0); }
    }
    function sendHome(a, t){
      leaveZone(a);
      a.anim = {fx:a.x, fy:a.y, tx:a.hx, ty:a.hy, start:t, dur:450};
    }
    function target(a){ return a.isIon ? a.ion.r : a.rpm; }
    function startDrag(ev, a){
      ev.preventDefault();
      a.anim = null;
      if (zoneAtom === a){ zoneAtom = null; measured = false; leaveZone(a); }
      const p = toLocal(ev);
      drag = {a, id:ev.pointerId, dx:a.x - p.x, dy:a.y - p.y};
      gAtoms.appendChild(a.g);
      try { svg.setPointerCapture(ev.pointerId); } catch(_){}
    }
    hG.addEventListener('pointerdown', ev => {
      if (!zoneAtom || zoneAtom.anim || zoneAtom.morph) return;
      ev.preventDefault(); ev.stopPropagation();
      hDrag = ev.pointerId;
      measured = false;
      try { svg.setPointerCapture(ev.pointerId); } catch(_){}
    });
    svg.addEventListener('pointermove', ev => {
      if (hDrag === ev.pointerId){ len = clamp((toLocal(ev).x - C.x) / PX, 0, RMAX); return; }
      if (!drag || ev.pointerId !== drag.id) return;
      const p = toLocal(ev), a = drag.a;
      const r = a.R * a.s;
      a.x = clamp(p.x + drag.dx, r + 4, W - r - 4);
      a.y = clamp(p.y + drag.dy, r + 4, H - r - 4);
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(n => svg.addEventListener(n, ev => {
      if (hDrag === ev.pointerId){
        hDrag = null;
        const za = zoneAtom;
        if (za && Math.abs(len - target(za)) <= TOL){
          len = target(za);
          measured = true;
          const r = recorded[za.sym] || (recorded[za.sym] = {});
          if (za.isIon){ r.ion = za.ion.r; r.charge = chargeLabel(za.ion.charge); }
          else {
            r.atom = za.rpm;
            if (!za.ion){ r.charge = 'none'; r.ion = '—'; }
          }
          PT.update();
        }
        return;
      }
      if (!drag || ev.pointerId !== drag.id) return;
      const a = drag.a, t = performance.now();
      drag = null;
      if (inZone(a)){
        if (zoneAtom && zoneAtom !== a) sendHome(zoneAtom, t);
        zoneAtom = a;
        a.ts = MAG;
        a.g.classList.add('in-zone');
        a.anim = {fx:a.x, fy:a.y, tx:C.x, ty:C.y, start:t, dur:350};
        len = 30; measured = false;
      } else sendHome(a, t);
    }));

    makeReset(gReset, () => {
      const t = performance.now();
      drag = null; hDrag = null; zoneAtom = null; measured = false; len = 30;
      atoms.forEach(a => sendHome(a, t));
    });

    function render(){
      const za = zoneAtom, ready = za && !za.anim;
      const over = drag && inZone(drag.a);
      zoneRect.classList.toggle('hot', !!over);
      zoneText.style.display = (za || over) ? 'none' : '';
      gArrow.style.display = ready && !za.morph ? '' : 'none';
      gRead.style.display = ready ? '' : 'none';
      rdEmpty.style.display = ready ? 'none' : '';
      gBtn.style.display = ready ? '' : 'none';
      if (ready){
        const tipX = C.x + len * PX;
        rLine.setAttribute('x2', tipX.toFixed(1));
        hG.setAttribute('transform', `translate(${tipX.toFixed(1)},${C.y})`);
        const tgt = target(za), near = Math.abs(len - tgt) <= TOL;
        const outer = za.isIon ? za.ionOuter : za.outer;
        outer.classList.toggle('hot', !za.morph && (measured || (hDrag != null && near)));
        rLine.classList.toggle('done', measured);
        handle.classList.toggle('done', measured);
        if (za.isIon){
          const io = za.ion;
          rdName.innerHTML = `${io.name} (${za.sym}<tspan dy="-10" font-size="16">${io.charge}</tspan><tspan dy="10">)</tspan>`;
        } else rdName.textContent = za.name;
        rdVal.textContent = 'r = ' + Math.round(len) + ' pm';
        rdMsg1.classList.toggle('done', measured);
        if (!za.isIon){
          rdMsg1.textContent = measured ? 'Measured!' : 'Drag the red handle to the';
          rdMsg2.textContent = measured ? '' : 'outer edge of the atom.';
        } else if (!measured){
          rdMsg1.textContent = `${za.name} ${za.ion.change}.`;
          rdMsg2.textContent = 'Measure the ion’s radius.';
        } else {
          rdMsg1.textContent = 'Measured! The ion is ' + (za.ion.r < za.rpm ? 'smaller' : 'larger');
          rdMsg2.textContent = `than the neutral atom (${za.rpm} pm).`;
        }
        ionBtn.classList.toggle('off', !za.ionG);
        ionText.textContent = za.isIon ? 'Make it an atom again' : 'Make it an ion!';
        rdNote.textContent = za.ionG ? '' : 'Boron does not usually form an ion.';
      }
      PT.highlight(drag ? drag.a.sym : (za ? za.sym : null));
    }

    function frame(t){
      if (current === 'atomic-radius'){
        atoms.forEach(a => {
          if (a.anim){
            const p = clamp((t - a.anim.start) / a.anim.dur, 0, 1), k = ease(p);
            a.x = lerp(a.anim.fx, a.anim.tx, k); a.y = lerp(a.anim.fy, a.anim.ty, k);
            if (p >= 1) a.anim = null;
          }
          a.s += (a.ts - a.s) * 0.18;
          if (Math.abs(a.ts - a.s) < 0.002) a.s = a.ts;
          if (a.morph) applyMorph(a, t);
          a.g.setAttribute('transform', `translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${a.s.toFixed(3)})`);
        });
        render();
      }
      requestAnimationFrame(frame);
    }

    PT.update();
    requestAnimationFrame(frame);
  })();

  show(location.hash.slice(1) || 'home');
})();
</script>
</body>
</html>
